# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.


#######################################################
#                                                     #
#  Borders & Gaps                                     #
#                                                     #
#######################################################



$activeBorderColor = rgb(ab92fc) rgb(875faf) 90deg
$inactiveBorderColor = rgba(e6bb85aa) rgba(d99145bb) 90deg

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in = 8
    gaps_out = 16
    border_size = 3
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}


#######################################################
#                                                     #
#  Depth                                              #
#                                                     #
#######################################################


decoration {
    rounding = 0
    rounding_power = 0

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.03
        contrast = 0.95
        brightness = 0.70
        vibrancy = 0.08
        vibrancy_darkness = 0.35
        ignore_opacity = true
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        scale = 1.0
        color = rgba(101010cc)
        color_inactive = rgba(10101088)
    }
}


#######################################################
#                                                     #
#  Animations                                         #
#                                                     #
#######################################################


animations {
    enabled = true

    bezier = silk_drop, 0.42, 1.60, 0.80, 1

    animation = workspaces, 1, 3.5, silk_drop, slidevert
    animation = fade, 1, 2.5, silk_drop
}

