[window]
opacity = 0.92

[colors]
transparent_background_colors = true

[colors.primary]
background = "#201430"
foreground = "#E1D6F8"

[colors.cursor]
text = "#222222"
cursor = "#D99145"

[colors.vi_mode_cursor]
