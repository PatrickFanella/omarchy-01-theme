# Canonical Unit 01 palette from evangelion.nvim.
# ANSI 0-15 follow Neovim's terminal_color_* map. Quattro UI roles are
# set explicitly so Omarchy does not alias lime, lilac, or gold off the
# terminal slots.

mode = "dark"
accent = "#AB92FC"
active_border_color = "#AB92FC"
active_tab_background = "#AB92FC"

# Quattro shares these gradients between Hyprland and shell surfaces.
hyprland_active_border = "rgb(AB92FC) rgb(875FAF) 90deg"
hyprland_inactive_border = "rgba(E6BB85aa) rgba(D99145bb) 90deg"

# Neovim Cursor is LCL orange. Omarchy's resolver overwrites `cursor` to
# bright_fg for generated templates; shipped terminals keep the LCL cursor.
cursor = "#D99145"

# Neovim Normal
foreground = "#E1D6F8"
background = "#201430"

# Neovim Visual for terminal selection. UI selection stays a raised violet.
selection_foreground = "#222222"
selection_background = "#8EDF5F"

# Neovim terminal_color_0 through terminal_color_14.
# color7/color15 are unset in Neovim; extras use Shinji-adjacent gray and Rei.
# color8 uses extras Shinji instead of Neovim tokyo3 (#111111), which is darker
# than color0 and breaks ANSI bright-black.
color0 = "#201430"
color1 = "#BF2D2D"
color2 = "#8EDF5F"
color3 = "#D99145"
color4 = "#CE67F0"
color5 = "#875FAF"
color6 = "#9DAFD1"
color7 = "#E1D6F8"
color8 = "#A1A0AD"
color9 = "#DB6088"
color10 = "#87FF5F"
color11 = "#E6BB85"
color12 = "#B968FC"
color13 = "#AB92FC"
color14 = "#A4D2EC"
color15 = "#E1D6F8"

# Omarchy Quattro semantic roles. These are UI jobs, not ANSI mirrors.
bg = "#201430"
lighter_bg = "#39274D"
selection = "#402C56"
muted = "#A1A0AD"
dark_fg = "#A1A0AD"
fg = "#E1D6F8"
light_fg = "#D4D4D4"
bright_fg = "#E1D6F8"
red = "#BF2D2D"
green = "#87FF5F"
yellow = "#E6BB85"
blue = "#AB92FC"
magenta = "#CE67F0"
cyan = "#A4D2EC"
orange = "#D99145"
brown = "#D99145"
dark_bg = "#14091E"
darker_bg = "#101010"
bright_red = "#DB6088"
bright_green = "#87FF5F"
bright_yellow = "#E6BB85"
bright_blue = "#B968FC"
bright_magenta = "#AB92FC"
bright_cyan = "#A4D2EC"